# Конфигурация Apache для CrocoMim Dictionary System
# Этот файл нужно разместить в /etc/apache2/sites-available/crocomim.conf
# или добавить содержимое в существующий конфиг вашего сайта.

<VirtualHost *:80>
    ServerName crocomim.ru
    ServerAlias www.crocomim.ru

    # Документ рут для статических файлов (главная страница, картинки и т.д.)
    DocumentRoot /workspace/public

    <Directory /workspace/public>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- НАСТРОЙКА ПРОКСИ ДЛЯ СЛОВАРЕЙ И API ---
    
    # Включаем модули проксирования (должны быть активированы в Apache)
    # ProxyRequests Off
    # ProxyPreserveHost On

    # Проксирование страницы словарей
    # Запросы на /dictionaries и /dictionaries/* идут на Python бэкенд
    ProxyPass /dictionaries http://127.0.0.1:3000/dictionaries
    ProxyPassReverse /dictionaries http://127.0.0.1:3000/dictionaries

    # Проксирование API эндпоинтов (если они тоже обрабатываются Python)
    # Замените префиксы на те, что используются в вашем app.py
    ProxyPass /api http://127.0.0.1:3000/api
    ProxyPassReverse /api http://127.0.0.1:3000/api
    
    ProxyPass /user http://127.0.0.1:3000/user
    ProxyPassReverse /user http://127.0.0.1:3000/user

    ProxyPass /marketplace http://127.0.0.1:3000/marketplace
    ProxyPassReverse /marketplace http://127.0.0.1:3000/marketplace

    ProxyPass /generate-dictionary http://127.0.0.1:3000/generate-dictionary
    ProxyPassReverse /generate-dictionary http://127.0.0.1:3000/generate-dictionary

    # Логи
    ErrorLog ${APACHE_LOG_DIR}/crocomim_error.log
    CustomLog ${APACHE_LOG_DIR}/crocomim_access.log combined
</VirtualHost>

# Инструкция по активации:
# 1. Скопируйте этот файл в /etc/apache2/sites-available/crocomim.conf
# 2. Включите модули:
#    sudo a2enmod proxy
#    sudo a2enmod proxy_http
# 3. Отключите дефолтный сайт (если конфликтует):
#    sudo a2dissite 000-default.conf
# 4. Включите новый сайт:
#    sudo a2ensite crocomim.conf
# 5. Проверьте конфигурацию на ошибки:
#    sudo apache2ctl configtest
# 6. Перезагрузите Apache:
#    sudo systemctl restart apache2

# ВАЖНО: Убедитесь, что ваш Python скрипт (app.py) запущен и слушает порт 3000.
# Рекомендуется использовать systemd сервис или supervisor для автозапуска Python приложения.
