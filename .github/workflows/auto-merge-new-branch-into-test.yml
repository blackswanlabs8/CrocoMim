name: Auto merge new branch into test

on:
  push:
    branches:
      - '**'   # реагируем на пуш в любую ветку

permissions:
  contents: write

jobs:
  merge-into-test:
    # Запускаем ТОЛЬКО при создании новой ветки
    # и не трогаем main и test
    if: >
      github.event.created == true &&
      github.ref != 'refs/heads/main' &&
      github.ref != 'refs/heads/test'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin --prune

      - name: Ensure test branch exists
        run: |
          git show-ref --verify --quiet "refs/remotes/origin/test" || {
            echo "Ветка origin/test не найдена"
            exit 1
          }

      - name: Checkout test branch
        run: |
          # Делаем локальную ветку test, указывая на origin/test
          git checkout -B test origin/test

      - name: Merge new branch into test (prefer new branch)
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Новая ветка: $BRANCH"
          echo "Мержим origin/$BRANCH в test с приоритетом НОВОЙ ветки при конфликтах"

          # Подтянем свежую версию новой ветки с origin
          git fetch origin "$BRANCH"

          # Сейчас HEAD = test, мержим "другую сторону" в неё
          git merge -X theirs "origin/$BRANCH" -m "Auto-merge origin/$BRANCH into test (prefer new branch changes)"

      - name: Push updated test
        run: |
          git push origin test

      - name: Delete merged branch
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          echo "Удаляем ветку $BRANCH из origin"

          # Пытаемся удалить удалённую ветку
          git push origin --delete "$BRANCH" || echo "Не удалось удалить ветку $BRANCH (возможно, уже удалена)"

          # Чистим локальную ветку на раннере (на всякий случай)
          git branch -D "$BRANCH" || true
