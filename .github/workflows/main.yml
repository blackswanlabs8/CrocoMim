name: Deploy /public to Sprinthost

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: ['public/**']   # деплой только при изменениях в /public

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /public exists
        run: |
          test -d public || { echo "public/ not found in repo root"; exit 1; }

      - name: Ensure remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            mkdir -p /home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html
            chmod 755 /home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html

      # Копируем через rsync с защитой папок test/, api/ и api.test/
      - name: Deploy with rsync (preserve test/, api/, api.test/)
        env:
          RSYNC_RSH: "ssh -i ${{ secrets.SSH_KEY }} -o StrictHostKeyChecking=no"
        run: |
          RSYNC_SRC="public/"
          RSYNC_DEST="${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html/"

          rsync -az --delete \
            --exclude 'test/**' \
            --exclude 'api/**' \
            --exclude 'api.test/**' \
            --omit-dir-times --no-perms \
            --chmod=Du=rwx,Dgo=rx,Fu=rw,Fgo=r \
            -e "$RSYNC_RSH" \
            "$RSYNC_SRC" "$RSYNC_DEST"
