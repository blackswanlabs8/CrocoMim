name: Deploy /public to Sprinthost

on:
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths: ['public/**']   # деплой только при изменениях в /public

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /public exists
        shell: bash
        run: |
          set -euo pipefail
          test -d public || { echo "public/ not found in repo root"; exit 1; }
          echo "Found public/; size:" && du -sh public || true

      - name: Ensure remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -e
            BASE="/home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html"
            mkdir -p "$BASE"
            chmod 755 "$BASE"

      - name: Deploy with rsync over SSH
        uses: burnett01/rsync-deployments@7.1.0
        with:
          # -a  архивный режим, -z сжатие, --delete зеркалирование
          # protect-фильтры страхуют нужные каталоги от удаления,
          # exclude не заливает их содержимое поверх.
          switches: >-
            -az --delete
            --chmod=F644,D755
            --filter='protect /test/'
            --filter='protect /api/'
            --filter='protect /api.test/'
            --exclude '/test/'
            --exclude '/api/'
            --exclude '/api.test/'
          path: ./public/   # отправляем ТОЛЬКО содержимое public/
          remote_path: /home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key:  ${{ secrets.SSH_KEY }}
