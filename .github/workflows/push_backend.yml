name: Deploy /backend to crocomim.ru/api

on:
  # запуск по кнопке
  workflow_dispatch: {}

  # автозапуск после завершения Force sync
  workflow_run:
    workflows: ["Force sync - test → main"]
    types:
      - completed

  # старое поведение: деплой при обычном push в main
  push:
    branches: [ main ]
    paths: ['backend/**']   # деплой только при изменениях в /backend

concurrency:
  group: deploy-prod-backend
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /backend exists
        shell: bash
        run: |
          set -e
          test -d backend || { echo "backend/ not found in repo root"; exit 1; }
          echo "Found backend/:"
          du -sh backend || true

      - name: Ensure remote directory (crocomim.ru/public_html/api)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -e
            REMOTE_ROOT="/home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html/api"
            mkdir -p "$REMOTE_ROOT"
            chmod 755 "$REMOTE_ROOT"
            echo "REMOTE_ROOT ensured: $REMOTE_ROOT"

      - name: Deploy with rsync over SSH
        uses: burnett01/rsync-deployments@7.1.0
        with:
          # -a архивный режим, -z сжатие, --delete зеркалирование
          switches: >-
            -az --delete
            --chmod=F644,D755
            --exclude='venv/'
            --exclude='backendctl'
          path: ./backend/   # отправляем ТОЛЬКО содержимое backend/
          remote_path: /home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html/api
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key:  ${{ secrets.SSH_KEY }}
