name: Deploy /public to crocomim.ru

on:
  # запуск по кнопке
  workflow_dispatch: {}

  # автозапуск после завершения Force sync
  workflow_run:
    workflows: ["Force sync - test → main"]
    types:
      - completed

  # старое поведение: деплой при обычном push в main
  push:
    branches: [ main ]
    paths: ['public/**']   # деплой только при изменениях в /public


concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy:
    # если workflow запущен по workflow_run → только при успешном Force sync
    # если по push или workflow_dispatch → запускаем всегда
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify /public exists
        run: |
          set -e
          test -d public || { echo "public/ not found in repo root"; exit 1; }
          echo "Found public/:"
          du -sh public || true

      - name: Ensure remote directory (crocomim.ru/public_html)
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key:      ${{ secrets.SSH_KEY }}
          script: |
            set -e
            REMOTE_ROOT="/home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html"
            mkdir -p "$REMOTE_ROOT"
            chmod 755 "$REMOTE_ROOT"
            echo "REMOTE_ROOT ensured: $REMOTE_ROOT"

      - name: Deploy with rsync over SSH
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: >-
            -az --delete
            --chmod=F644,D755
            --exclude='test/'
            --exclude='api/'
            --exclude='api.test/'
            --exclude='.htaccess'
          path: ./public/   # отправляем ТОЛЬКО содержимое public/
          remote_path: /home/${{ secrets.SSH_USER }}/domains/${{ secrets.DOMAIN }}/public_html
          remote_host: ${{ secrets.SSH_HOST }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key:  ${{ secrets.SSH_KEY }}
