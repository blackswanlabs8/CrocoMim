name: Force sync branch into main

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Из какой ветки сделать main'
        required: true
        default: 'test'
      confirm_text:
        description: 'Напиши: Я ОЧЕНЬ ХОЧУ ПЕРЕЗАПИСАТЬ MAIN'
        required: true
        default: ''

permissions:
  contents: write   # нужно, чтобы пушить в репозиторий

jobs:
  force-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужны все коммиты

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin

      - name: Validate confirmation text
        run: |
          CONFIRM="${{ github.event.inputs.confirm_text }}"
          REQUIRED="Я ОЧЕНЬ ХОЧУ ПЕРЕЗАПИСАТЬ MAIN"

          echo "Проверяем подтверждение..."
          if [ "$CONFIRM" != "$REQUIRED" ]; then
            echo "Текст подтверждения не совпадает."
            echo "Ожидалось: $REQUIRED"
            echo "Получено:  $CONFIRM"
            echo "Операция отменена."
            exit 1
          fi

      - name: Reset main to source branch
        run: |
          SRC_BRANCH="${{ github.event.inputs.source_branch }}"

          echo "Синхронизируем main с origin/$SRC_BRANCH"

          # Проверим, что ветка-источник существует на origin
          git show-ref --verify --quiet "refs/remotes/origin/$SRC_BRANCH" || {
            echo "Ветка origin/$SRC_BRANCH не найдена"
            exit 1
          }

          # Переключаемся на main
          git checkout main

          # Жёстко приравниваем main к origin/source_branch
          git reset --hard "origin/$SRC_BRANCH"

      - name: Force push main
        run: |
          git push origin main --force
