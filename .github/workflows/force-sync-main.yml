name: Force sync - test → main

on:
  workflow_dispatch:
    inputs:
      info:
        description: "Направление: test → main. Этот запуск ПОЛНОСТЬЮ перезапишет main содержимым test."
        required: false
        default: "test → main"

permissions:
  contents: write

jobs:
  force-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch all branches
        run: |
          git fetch origin

      - name: Reset main to origin/test (direction - test → main)
        run: |
          echo "ВАЖНО: направление синхронизации: origin/test → main"
          git show-ref --verify --quiet "refs/remotes/origin/test" || {
            echo "Ветка origin/test не найдена"
            exit 1
          }

          echo "Переключаемся на main"
          git checkout main

          echo "Жёстко приравниваем main к origin/test"
          git reset --hard origin/test

      - name: Force push main
        run: |
          git push origin main --force
