name: Publish preview link

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write
  statuses: write
  checks: write

jobs:
  preview-link:
    name: Generate preview link and annotate PR
    runs-on: ubuntu-latest

    steps:
      - name: Compute preview URL
        id: vars
        run: |
          echo "BRANCH=${{ github.head_ref }}" >> $GITHUB_OUTPUT
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/refs/heads/${{ github.head_ref }}/public/index.html"
          echo "RAW_URL=$RAW_URL" >> $GITHUB_OUTPUT
          PREVIEW_URL="https://htmlpreview.github.io/?$RAW_URL"
          echo "PREVIEW_URL=$PREVIEW_URL" >> $GITHUB_OUTPUT

      - name: Check preview availability (HEAD request)
        id: check
        run: |
          set -e
          url="${{ steps.vars.outputs.RAW_URL }}"
          code=$(curl -s -o /dev/null -w "%{http_code}" -I "$url")
          echo "HTTP_CODE=$code" >> $GITHUB_OUTPUT
          echo "HTTP code: $code"

      - name: Compute status fields
        id: status
        run: |
          if [ "${{ steps.check.outputs.HTTP_CODE }}" = "200" ]; then
            echo "STATE=success" >> $GITHUB_OUTPUT
            echo "DESC=Preview is available" >> $GITHUB_OUTPUT
          else
            echo "STATE=failure" >> $GITHUB_OUTPUT
            echo "DESC=index.html not found (HTTP ${{ steps.check.outputs.HTTP_CODE }})" >> $GITHUB_OUTPUT
          fi

      - name: Comment (create or update) on PR with preview link
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            ✅ **Preview for this branch**

            [▶️ Открыть превью](${{ steps.vars.outputs.PREVIEW_URL }})

            _Raw_: `${{ steps.vars.outputs.RAW_URL }}`
          comment-tag: preview-link
          mode: upsert
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set commit status with link
        uses: dawidd6/action-update-status@v2
        with:
          sha: ${{ github.event.pull_request.head.sha }}
          state: ${{ steps.status.outputs.STATE }}
          context: "Preview Site"
          description: ${{ steps.status.outputs.DESC }}
          target_url: ${{ steps.vars.outputs.PREVIEW_URL }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
